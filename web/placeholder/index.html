<!doctype html>
<!-- Temporary page for the GitHub Pages site until the React dashboard
     (Phase 6, step 2) replaces it. The data it lists is the real, hourly
     export (scripts/export_dashboard.py). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F1 Predictor</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; } }
    body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; }
    p { color: var(--muted); }
    code { font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>F1 Predictor</h1>
    <p>The dashboard is being built. The prediction data it will show is already published here, updated hourly:</p>
    <ul>
      <li><a href="data/index.json"><code>data/index.json</code></a>: the calendar and the next race</li>
      <li><a href="data/scorecard.json"><code>data/scorecard.json</code></a>: accuracy vs the baselines</li>
      <li><a href="data/version.json"><code>data/version.json</code></a>: when the data last changed</li>
    </ul>
  </main>
</body>
</html>
