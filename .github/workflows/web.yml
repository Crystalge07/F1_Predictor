# The dashboard app's checks: on every push or pull request that touches
# web/, type-check, run the front-end tests and build it. (The hourly
# pipeline builds it too, before deploying; this catches a broken app at the
# push, not at the next deploy.)

name: Dashboard app

on:
  push:
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
