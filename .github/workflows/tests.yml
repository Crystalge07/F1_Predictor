# The Python test suite, on every push and pull request.
#
# Why it matters here more than usual: the hourly pipeline (tick.yml) runs
# whatever is on main, and a live prediction it logs can never be changed or
# deleted (the log is append-only). Without this, a broken push would only
# show up as a bad (or blocked) live prediction at the next tick. With it,
# GitHub marks the commit red within minutes.
#
# Tests that need the real database (tests/real_db.py) skip themselves here:
# the database lives in a GitHub Release asset, not in the repository.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"      # the same version the pipeline runs on
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install
        # The same locked library versions as the pipeline (tick.yml), plus
        # the dev tools (pytest, pyyaml), also pinned by the lock.
        run: pip install -e ".[dev]" -c requirements.lock

      - name: Run the tests
        run: pytest -q
