# The hands-off pipeline: run one tick every hour (scripts/tick.py).
#
# The database is a single SQLite file kept as an asset of the GitHub Release
# named "database" (decision 2026-11-03, docs/PRD.md). Each run:
#   1. downloads it,
#   2. runs one tick (fetch what's ready, predict live, score, alert),
#   3. checks the result is safe to upload (scripts/check_db_upload.py: the
#      file is healthy and every live prediction is still there, unchanged),
#   4. uploads it back, after saving the downloaded copy as a backup,
#   5. exports the dashboard's data (scripts/export_dashboard.py) and, if it
#      or the code changed since the live site was deployed, deploys the
#      site to GitHub Pages (the "pages" job below),
#   6. pings an outside dead-man's switch (healthchecks.io), which emails if
#      the pings stop for 3 hours, i.e. if the pipeline stops running at all,
#   7. fails the run if the tick raised a NEW alert, so GitHub emails about it.
#
# Off until the repository variable PIPELINE_ENABLED is set to "true"
# (Settings -> Secrets and variables -> Actions -> Variables).

name: Pipeline tick

on:
  schedule:
    # Every hour at :07 (cron is UTC). Not :00, when GitHub's scheduler is
    # busiest and most likely to start late. The planner's 2-hour last call
    # (pipeline/plan.py) leaves room for late starts.
    - cron: "7 * * * *"
  workflow_dispatch:            # the "Run workflow" button, for a run by hand
    inputs:
      dry_run:
        description: "Dry run: fetch data and check predictions, but log no predictions"
        type: boolean
        default: false

# One run at a time, ever: two ticks downloading and uploading the same file
# at once would lose one's work. A new run waits for the current one.
concurrency:
  group: pipeline-database
  cancel-in-progress: false

permissions:
  contents: write               # needed to upload release assets

jobs:
  tick:
    if: vars.PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Read by the pages job: whether there's something new to deploy.
      deploy: ${{ steps.export.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}   # lets the gh CLI use this repository's releases
      RELEASE: database
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"      # the version the project is developed on
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install
        # -c requirements.lock: exactly the library versions the tests passed
        # on (scripts/lock_requirements.py). Without it pip would take the
        # newest release of everything, and a new XGBoost or pandas could
        # quietly change the frozen model, which is retrained every run.
        # A live run is refused if the model libraries don't match the lock.
        run: pip install -e . -c requirements.lock
        # Everything written below lives under data/ (gitignored), so the
        # checkout stays clean and model_version names the exact commit;
        # a dirty tree would block every live prediction (predict/stage.py).

      - name: Download the database
        run: |
          mkdir -p data/upload
          gh release download "$RELEASE" --pattern f1.sqlite.gz --dir data
          gunzip --keep data/f1.sqlite.gz              # keep the .gz: it's the backup
          cp data/f1.sqlite data/f1.before.sqlite      # what the guard compares against

      - name: Show the code version
        # Live predictions are only logged from a clean commit (a version
        # ending in -dirty would block them), so it's printed in every run.
        run: python -c "from f1predictor.predict.stage import model_version; print('code version:', model_version())"

      - name: Tick
        id: tick
        run: |
          set +e                       # don't stop here on exit 1: upload first
          python scripts/tick.py ${{ inputs.dry_run && '--dry-run' || '' }}
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Check the database is safe to upload
        run: python scripts/check_db_upload.py data/f1.before.sqlite data/f1.sqlite

      - name: Upload the database
        run: |
          # 1. The copy downloaded at the start, as the previous version.
          cp data/f1.sqlite.gz data/upload/f1-previous.sqlite.gz
          gh release upload "$RELEASE" data/upload/f1-previous.sqlite.gz --clobber
          # 2. The new version.
          gzip -c data/f1.sqlite > data/upload/f1.sqlite.gz
          gh release upload "$RELEASE" data/upload/f1.sqlite.gz --clobber
          # 3. Once a day, a backup named after the weekday, so there are
          #    always 7 days of history to go back to. Uploaded by the FIRST
          #    run of the UTC day, whenever that is: today's file is missing,
          #    or is last week's (older than a day). Until 2026-11-10 this
          #    only ran in the 00:xx hour, so a day whose midnight run was
          #    skipped (GitHub's scheduler drops runs) got no backup at all:
          #    there was no f1-Wed.
          backup="f1-$(date -u +%a).sqlite.gz"
          updated="$(gh release view "$RELEASE" --json assets \
                     --jq ".assets[] | select(.name == \"$backup\") | .updatedAt")"
          age=$(( $(date -u +%s) - $(date -u -d "${updated:-1970-01-01T00:00:00Z}" +%s) ))
          if [ "$age" -gt 86400 ]; then
            cp data/upload/f1.sqlite.gz "data/upload/$backup"
            gh release upload "$RELEASE" "data/upload/$backup" --clobber
            echo "uploaded the daily backup $backup"
          else
            echo "$backup is from today already (${age}s old): not replaced"
          fi

      - name: Export the dashboard data
        id: export
        # After the upload, so the database is safe whatever happens here.
        # The site = the React app (built below) + this data. Deployed only
        # if something changed since the live site: the data's hash or the
        # code's commit. Most hours, neither has, and nothing is built.
        run: |
          mkdir -p site
          python scripts/export_dashboard.py data/f1.sqlite site
          new="$(python -c "import json; print(json.load(open('site/data/version.json'))['hash'])")@${GITHUB_SHA}"
          echo "{\"deployed\": \"$new\"}" > site/deployed.json
          live="$(curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/deployed.json" 2>/dev/null \
                  | python -c "import json, sys; print(json.load(sys.stdin)['deployed'])" 2>/dev/null || echo none)"
          echo "live site: $live"
          echo "this run:  $new"
          if [ "$new" != "$live" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Node
        if: steps.export.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the dashboard app
        if: steps.export.outputs.changed == 'true'
        # The exact versions in web/package-lock.json (npm ci), type-checked
        # and built into web/dist, then put next to the exported data/.
        run: |
          cd web
          npm ci
          npm run build
          cp -r dist/. ../site/

      - name: Package the site for GitHub Pages
        if: steps.export.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Ping the dead-man's switch
        # healthchecks.io expects a ping every hour and emails when none has
        # come for 3 hours (period 1h + grace 2h): the one alert that works
        # when nothing runs at all. "/fail" if an earlier step failed (it
        # emails at once). always(): it must ping even after a failure.
        # Does nothing until the repository secret HEALTHCHECK_URL is set.
        if: always()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then echo "no HEALTHCHECK_URL secret: not pinging"; exit 0; fi
          if [ "$JOB_STATUS" = "success" ]; then url="$HEALTHCHECK_URL"; else url="$HEALTHCHECK_URL/fail"; fi
          # A failed ping must never fail the run itself.
          curl -fsS -m 10 --retry 3 "$url" > /dev/null && echo "pinged ($JOB_STATUS)" || echo "ping failed (ignored)"

      - name: Fail if the tick raised a new alert
        if: steps.tick.outputs.code != '0'
        run: |
          echo "The tick raised a new alert (or crashed): see the Tick step above."
          exit 1

  # Deploys the site packaged by the tick job to GitHub Pages, when it changed.
  # A separate job because Pages needs its own permissions. `always()`: it
  # still deploys when the tick job failed only to send an alert email
  # (its last step); if the export itself failed, there's nothing to deploy.
  pages:
    needs: tick
    if: always() && needs.tick.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write              # to deploy to GitHub Pages
      id-token: write           # to prove the deploy comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
